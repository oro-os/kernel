name: deps
description: Installs all dependencies needed for the CI runs
runs:
  using: "composite"
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt, clippy, rustc-dev, rust-src, llvm-tools-preview
    - name: Install APT dependencies
      shell: bash
      run: |
        set -e
        sudo apt update && sudo apt install -y --no-install-recommends \
          pkg-config \
          xorriso \
          libchafa-dev
    - name: Set pkg-config path
      shell: bash
      run: |
        ls -l /usr/lib/x86_64-linux-gnu/pkgconfig
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
